[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hinglish-transcriber"
version = "1.1.0"
description = "Transcribe Hindi/Urdu call recordings into Hinglish (Roman-script Hindi) with faster-whisper"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sandeep" }]
keywords = ["speech-to-text", "whisper", "hindi", "urdu", "hinglish", "transliteration"]
dependencies = [
    "faster-whisper>=1.2.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
web = ["gradio>=5.0"]

[project.scripts]
hinglish-transcribe = "transcriber.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber"]

# ----------------------------------------------------------------------------
# Tooling
# ----------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "N",        # naming
    "RUF",      # ruff-specific
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Devanagari strings are intentional, not "ambiguous" characters
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["src/transcriber"]
ignore_missing_imports = true   # faster_whisper and ctranslate2 ship no type stubs
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=transcriber --cov-report=term-missing"
